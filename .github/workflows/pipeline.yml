name: Pipeline (research through pre-publish)

on:
  workflow_dispatch: {}
  # Heartbeat: uncomment once every stage has been confirmed working on a
  # manual run. Publish (Stage 9) is a SEPARATE workflow and is never
  # triggered from here - see SYSTEM_PLAN.md.
  # schedule:
  #   - cron: '0 */6 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests piper-tts

      # Each stage below has continue-on-error: true. One stage failing
      # (e.g. a bad credential) should not throw away work a different,
      # independent stage already did in the same run - and the final
      # commit step must still run to save that work.

      - name: Stage 1 - Trend research
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
          BEDROCK_MODEL_ID: ${{ secrets.BEDROCK_MODEL_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: python scripts/trend_research.py

      - name: Stage 3 - Script generation
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
          BEDROCK_MODEL_ID: ${{ secrets.BEDROCK_MODEL_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: python scripts/stage3_script.py

      - name: Stage 4 - Voiceover
        continue-on-error: true
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PIPER_VOICE: ${{ secrets.PIPER_VOICE }}
        run: python scripts/stage4_voiceover.py

      - name: Stage 5 - Visual sourcing
        continue-on-error: true
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/stage5_visuals.py

      - name: Stage 6 - Edit and render
        continue-on-error: true
        run: python scripts/stage6_render.py

      - name: Stage 8 - Metadata
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
          BEDROCK_MODEL_ID: ${{ secrets.BEDROCK_MODEL_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: python scripts/stage8_metadata.py

      - name: Commit pipeline outputs
        if: always()
        run: |
          git config user.name "pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ scripts-content/ assets/
          git diff --cached --quiet || git commit -m "Pipeline run: automated stage outputs [skip ci]"
          git push

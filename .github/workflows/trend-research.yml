name: Stage 1 - Trend research

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: '0 */6 * * *'

jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run trend research
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/trend_research.py

      - name: Commit results
        run: |
          git config user.name "trend-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/topic-cycles.json
          git diff --cached --quiet || git commit -m "Auto: new topic shortlist [skip ci]"
          git push
